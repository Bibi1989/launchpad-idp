[project]
name = "launchpad-api"
version = "0.1.0"
description = "Launchpad IDP control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "structlog>=24.4.0",
  "python-multipart>=0.0.17",
  "httpx>=0.28.0",
  "kubernetes>=31.0.0",
  "cryptography>=43.0.0",
  "PyGithub>=2.5.0",
  "docker>=7.1.0",
  "PyJWT>=2.9.0",
  "bcrypt>=4.2.0",
  "email-validator>=2.2.0",
  "PyYAML>=6.0.0",
  "google-genai>=1.0.0",
  "stripe>=11.0.0",
  "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "aiosqlite>=0.20.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Repo-root shared package (`pkg/`) lives two levels up from apps/api.
pythonpath = [".", "../.."]

[tool.ruff]
line-length = 100
target-version = "py311"
