# Full stack for a self-hosted laptop/server (16GB+ recommended when KUBERNETES_ENABLED=true).
# From repo root:
#   cp deploy/oci/env.example deploy/oci/.env
#   # edit deploy/oci/.env
#   docker compose -f deploy/oci/docker-compose.yml --env-file deploy/oci/.env up -d --build
#
# Or: make oci-up
#
# Local Sandbox: api/worker talk to the host Docker daemon (k3d) via the mounted socket.

name: launchpad-oci

x-api-build: &api_build
  context: ../..
  dockerfile: deploy/oci/Dockerfile.api

x-k8s-volumes: &k8s_volumes
  - workspace_data:/var/lib/launchpad/workspaces
  - kube_data:/kube
  - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
  - ../../scripts:/opt/launchpad/scripts:ro

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      # Homelab: CADDY_HTTP_PORT=8080 → http://localhost:8080 (maps to container :80).
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      LAUNCHPAD_SITE_ADDRESS: ${LAUNCHPAD_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-entrypoint.sh:/entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: /api/v1
        NUXT_PUBLIC_WS_BASE: ""
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_PUBLIC_WS_BASE: ""
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build: *api_build
    # Serve only. Schema migration is handled once by the `migrate` service below,
    # which this service waits on (see depends_on), so the API never runs against an
    # un-migrated database and a migration error can't crash-loop the API.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &api_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-launchpad}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-launchpad}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CORS_ORIGINS: '["${LAUNCHPAD_PUBLIC_ORIGIN}"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      AUTH_DEV_LOGIN_ENABLED: ${AUTH_DEV_LOGIN_ENABLED:-false}
      DEFAULT_WORKLOAD_IMAGE: ${DEFAULT_WORKLOAD_IMAGE:-nginx:1.27-alpine}
      KUBERNETES_ENABLED: ${KUBERNETES_ENABLED:-true}
      KUBERNETES_IN_CLUSTER: "false"
      KUBERNETES_KUBECONFIG_PATH: /kube/config
      KUBECONFIG: /kube/config
      LOCAL_K8S_ENGINE: ${LOCAL_K8S_ENGINE:-k3s}
      
      KIND_AUTO_MANAGE: ${KIND_AUTO_MANAGE:-true}
      KIND_CLUSTER_NAME: ${KIND_CLUSTER_NAME:-launchpad}
      KIND_SCRIPTS_DIR: /opt/launchpad/scripts
      # Reach k3d API from inside api/worker containers (client address).
      K3D_API_HOST: ${K3D_API_HOST:-host.docker.internal}
      K3D_API_PORT: ${K3D_API_PORT:-6445}
      # Host address k3d binds/publishes the apiserver on. Keep 0.0.0.0; never a
      # gateway alias like host.docker.internal (that address is not bindable).
      K3D_API_BIND_HOST: ${K3D_API_BIND_HOST:-0.0.0.0}
      PREVIEW_NODE_PORT_MIN: ${PREVIEW_NODE_PORT_MIN:-30080}
      PREVIEW_NODE_PORT_MAX: ${PREVIEW_NODE_PORT_MAX:-30089}
      PREVIEW_NODE_HOST: ${PREVIEW_NODE_HOST:-}
      PREVIEW_INGRESS_HTTP_PORT: ${PREVIEW_INGRESS_HTTP_PORT:-3080}
      PREVIEW_PUBLIC_BASE_URL: ${PREVIEW_PUBLIC_BASE_URL:-${LAUNCHPAD_PUBLIC_ORIGIN}}
      USE_CLOUDFLARE_TUNNEL: ${USE_CLOUDFLARE_TUNNEL:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-}
      PREVIEW_TUNNEL_MODE: ${PREVIEW_TUNNEL_MODE:-off}
      PREVIEW_INGRESS_CLASS: ${PREVIEW_INGRESS_CLASS:-nginx}
      IAC_WORKSPACE_ROOT: /var/lib/launchpad/workspaces
      INVITE_BASE_URL: ${LAUNCHPAD_PUBLIC_ORIGIN}/invite
      GITHUB_APP_SETUP_URL: ${LAUNCHPAD_PUBLIC_ORIGIN}/integrations/github
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      GITLAB_OAUTH_CLIENT_ID: ${GITLAB_OAUTH_CLIENT_ID:-}
      GITLAB_OAUTH_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:-}
      GITLAB_OAUTH_REDIRECT_URI: ${GITLAB_OAUTH_REDIRECT_URI:-}
      # Gemini (preview analyzer, workspace file AI, Dockerfile review)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      PREVIEW_ANALYZER_HEURISTIC_FALLBACK: ${PREVIEW_ANALYZER_HEURISTIC_FALLBACK:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_EMAIL_FROM: ${RESEND_EMAIL_FROM:-}
    volumes: *k8s_volumes
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot database migration. Runs `alembic upgrade head` to completion BEFORE
  # api/worker/beat start (they gate on service_completed_successfully), so no service
  # ever serves against an un-migrated schema, migrations run exactly once (no races
  # between api/worker/beat), and a migration failure surfaces here instead of
  # crash-looping the API.
  migrate:
    build: *api_build
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      <<: *api_env
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: *api_build
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *api_env
    volumes: *k8s_volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  beat:
    build: *api_build
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=INFO"]
    restart: unless-stopped
    environment:
      <<: *api_env
      TTL_REAPER_INTERVAL_SECONDS: ${TTL_REAPER_INTERVAL_SECONDS:-300}
    volumes:
      - workspace_data:/var/lib/launchpad/workspaces
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-launchpad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-launchpad}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-launchpad} -d ${POSTGRES_DB:-launchpad}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local-only DB UI (bound to loopback). Do not publish this on a public interface.
  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  workspace_data:
  kube_data:
  caddy_data:
  caddy_config: