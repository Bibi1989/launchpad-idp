name: Deploy full stack

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options:
          - oci
          - local-mac
        default: oci

jobs:
  # Push to main (and manual target=oci): SSH to the homelab/server and recreate Compose.
  deploy-oci:
    if: ${{ github.event_name == 'push' || inputs.target == 'oci' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require SSH deploy secrets
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          missing=0
          for v in OCI_HOST OCI_USERNAME OCI_SSH_KEY; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Homelab deploy needs OCI_HOST, OCI_USERNAME, and OCI_SSH_KEY."
            echo "App secrets (POSTGRES_PASSWORD, JWT_SECRET, …) are kept on the server in deploy/oci/.env when GitHub secrets are unset."
            exit 1
          fi

      - name: Deploy over SSH (git pull + compose up)
        uses: appleboy/ssh-action@v1.2.0
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          LAUNCHPAD_PUBLIC_ORIGIN: ${{ secrets.LAUNCHPAD_PUBLIC_ORIGIN }}
          LAUNCHPAD_SITE_ADDRESS: ${{ secrets.LAUNCHPAD_SITE_ADDRESS }}
          AUTH_DEV_LOGIN_ENABLED: ${{ secrets.AUTH_DEV_LOGIN_ENABLED }}
          USE_CLOUDFLARE_TUNNEL: ${{ secrets.USE_CLOUDFLARE_TUNNEL }}
          PREVIEW_BASE_DOMAIN: ${{ secrets.PREVIEW_BASE_DOMAIN }}
          PREVIEW_TUNNEL_MODE: ${{ secrets.PREVIEW_TUNNEL_MODE }}
          CADDY_HTTP_PORT: ${{ secrets.CADDY_HTTP_PORT }}
          CADDY_HTTPS_PORT: ${{ secrets.CADDY_HTTPS_PORT }}
          KUBERNETES_ENABLED: ${{ secrets.KUBERNETES_ENABLED }}
          REPO_URL: ${{ secrets.LAUNCHPAD_REPO_URL }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          command_timeout: 45m
          envs: POSTGRES_PASSWORD,JWT_SECRET,SECRETS_ENCRYPTION_KEY,LAUNCHPAD_PUBLIC_ORIGIN,LAUNCHPAD_SITE_ADDRESS,AUTH_DEV_LOGIN_ENABLED,USE_CLOUDFLARE_TUNNEL,PREVIEW_BASE_DOMAIN,PREVIEW_TUNNEL_MODE,CADDY_HTTP_PORT,CADDY_HTTPS_PORT,KUBERNETES_ENABLED,REPO_URL,OCI_HOST
          script: |
            set -euo pipefail
            APP_DIR="${HOME}/launchpad-idp"
            REPO="${REPO_URL:-https://github.com/Bibi1989/launchpad-idp.git}"
            ENV_FILE="deploy/oci/.env"

            env_get() {
              # Read KEY from existing on-server .env (survives git reset when gitignored).
              key="$1"
              file="$2"
              if [ -f "$file" ]; then
                grep -E "^${key}=" "$file" | head -1 | cut -d= -f2- || true
              fi
            }

            is_placeholder() {
              val="$1"
              case "$val" in
                ""|change-me*|changeme*|replace-me*|TODO*|todo*) return 0 ;;
                *) return 1 ;;
              esac
            }

            gen_secret() {
              if command -v openssl >/dev/null 2>&1; then
                openssl rand -base64 48 | tr -d '\n'
              else
                head -c 48 /dev/urandom | base64 | tr -d '\n'
              fi
            }

            # Prefer an existing env file (gitignored) before clone/reset.
            EXISTING_ENV=""
            for candidate in \
              "$APP_DIR/$ENV_FILE" \
              "$HOME/launchpad/deploy/oci/.env" \
              "$HOME/launchpad-idp/deploy/oci/.env"
            do
              if [ -f "$candidate" ]; then
                EXISTING_ENV="$candidate"
                break
              fi
            done

            # Prefer GitHub secret when set; otherwise keep the value already on the server.
            POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$(env_get POSTGRES_PASSWORD "${EXISTING_ENV}")}"
            JWT_SECRET="${JWT_SECRET:-$(env_get JWT_SECRET "${EXISTING_ENV}")}"
            SECRETS_ENCRYPTION_KEY="${SECRETS_ENCRYPTION_KEY:-$(env_get SECRETS_ENCRYPTION_KEY "${EXISTING_ENV}")}"

            # Fallback: pull from a running compose stack (same host) before generating new values.
            if [ -d "$APP_DIR" ] && [ -f "$APP_DIR/deploy/oci/docker-compose.yml" ]; then
              cd "$APP_DIR"
              if is_placeholder "$POSTGRES_PASSWORD"; then
                POSTGRES_PASSWORD="$(docker compose -f deploy/oci/docker-compose.yml --env-file deploy/oci/.env exec -T postgres printenv POSTGRES_PASSWORD 2>/dev/null || true)"
              fi
              if is_placeholder "$JWT_SECRET"; then
                JWT_SECRET="$(docker compose -f deploy/oci/docker-compose.yml --env-file deploy/oci/.env exec -T api printenv JWT_SECRET 2>/dev/null || true)"
              fi
              if is_placeholder "$SECRETS_ENCRYPTION_KEY"; then
                SECRETS_ENCRYPTION_KEY="$(docker compose -f deploy/oci/docker-compose.yml --env-file deploy/oci/.env exec -T api printenv SECRETS_ENCRYPTION_KEY 2>/dev/null || true)"
              fi
              cd - >/dev/null
            fi

            if is_placeholder "$POSTGRES_PASSWORD"; then POSTGRES_PASSWORD=""; fi
            if is_placeholder "$JWT_SECRET"; then JWT_SECRET=""; fi
            if is_placeholder "$SECRETS_ENCRYPTION_KEY"; then SECRETS_ENCRYPTION_KEY=""; fi

            GENERATED=0
            if [ -z "${POSTGRES_PASSWORD}" ]; then
              POSTGRES_PASSWORD="$(gen_secret)"
              GENERATED=1
            fi
            if [ -z "${JWT_SECRET}" ]; then
              JWT_SECRET="$(gen_secret)"
              GENERATED=1
            fi
            if [ -z "${SECRETS_ENCRYPTION_KEY}" ]; then
              SECRETS_ENCRYPTION_KEY="$(gen_secret)"
              GENERATED=1
            fi
            if [ "$GENERATED" -eq 1 ]; then
              echo "Generated missing app secrets on the server and will write them to $APP_DIR/$ENV_FILE"
              echo "(Re-used on later deploys. Optionally store the same values as GitHub Actions secrets.)"
            fi

            PUBLIC_ORIGIN="${LAUNCHPAD_PUBLIC_ORIGIN:-$(env_get LAUNCHPAD_PUBLIC_ORIGIN "${EXISTING_ENV}")}"
            PUBLIC_ORIGIN="${PUBLIC_ORIGIN:-https://launchpad-idp.online}"
            SITE_ADDRESS="${LAUNCHPAD_SITE_ADDRESS:-$(env_get LAUNCHPAD_SITE_ADDRESS "${EXISTING_ENV}")}"
            SITE_ADDRESS="${SITE_ADDRESS:-:80}"
            case "$SITE_ADDRESS" in
              http://*|https://*|localhost|localhost:*|"") SITE_ADDRESS=":80" ;;
            esac
            HTTP_PORT="${CADDY_HTTP_PORT:-$(env_get CADDY_HTTP_PORT "${EXISTING_ENV}")}"
            HTTP_PORT="${HTTP_PORT:-8080}"
            HTTPS_PORT="${CADDY_HTTPS_PORT:-$(env_get CADDY_HTTPS_PORT "${EXISTING_ENV}")}"
            HTTPS_PORT="${HTTPS_PORT:-8443}"
            CF_TUNNEL="${USE_CLOUDFLARE_TUNNEL:-$(env_get USE_CLOUDFLARE_TUNNEL "${EXISTING_ENV}")}"
            CF_TUNNEL="${CF_TUNNEL:-true}"
            PREVIEW_DOMAIN="${PREVIEW_BASE_DOMAIN:-$(env_get PREVIEW_BASE_DOMAIN "${EXISTING_ENV}")}"
            PREVIEW_DOMAIN="${PREVIEW_DOMAIN:-launchpad-idp.online}"
            PREVIEW_MODE="${PREVIEW_TUNNEL_MODE:-$(env_get PREVIEW_TUNNEL_MODE "${EXISTING_ENV}")}"
            PREVIEW_MODE="${PREVIEW_MODE:-off}"
            K8S_ENABLED="${KUBERNETES_ENABLED:-$(env_get KUBERNETES_ENABLED "${EXISTING_ENV}")}"
            K8S_ENABLED="${K8S_ENABLED:-true}"
            DEV_LOGIN="${AUTH_DEV_LOGIN_ENABLED:-$(env_get AUTH_DEV_LOGIN_ENABLED "${EXISTING_ENV}")}"
            DEV_LOGIN="${DEV_LOGIN:-false}"

            # Preserve .env across reset (file is gitignored; still back it up).
            if [ -n "$EXISTING_ENV" ]; then
              cp -a "$EXISTING_ENV" /tmp/launchpad-oci.env.bak
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR" || true
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            mkdir -p deploy/oci
            umask 077
            cat > deploy/oci/.env <<EOF
            POSTGRES_USER=launchpad
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=launchpad
            JWT_SECRET=${JWT_SECRET}
            SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY}
            LAUNCHPAD_PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
            LAUNCHPAD_SITE_ADDRESS=${SITE_ADDRESS}
            CADDY_HTTP_PORT=${HTTP_PORT}
            CADDY_HTTPS_PORT=${HTTPS_PORT}
            AUTH_DEV_LOGIN_ENABLED=${DEV_LOGIN}
            USE_CLOUDFLARE_TUNNEL=${CF_TUNNEL}
            ENVIRONMENT=production
            PREVIEW_BASE_DOMAIN=${PREVIEW_DOMAIN}
            PREVIEW_TUNNEL_MODE=${PREVIEW_MODE}
            LOG_LEVEL=INFO
            KUBERNETES_ENABLED=${K8S_ENABLED}
            LOCAL_K8S_ENGINE=k3s
            KIND_AUTO_MANAGE=true
            KIND_CLUSTER_NAME=launchpad
            DOCKER_SOCK=/var/run/docker.sock
            K3D_API_HOST=host.docker.internal
            K3D_API_PORT=6445
            K3D_API_BIND_HOST=0.0.0.0
            DEFAULT_WORKLOAD_IMAGE=nginx:1.27-alpine
            TTL_REAPER_INTERVAL_SECONDS=300
            EOF
            sed -i 's/^[[:space:]]*//' deploy/oci/.env

            chmod +x deploy/oci/caddy-entrypoint.sh || true

            # Single source of truth for the compose invocation.
            dc() { docker compose -f deploy/oci/docker-compose.yml --env-file deploy/oci/.env "$@"; }

            # Dump the full stack state so any failure is diagnosable from the run log
            # (previously only the api tail was printed, hiding build/dependency errors).
            dump_diagnostics() {
              echo "===== docker compose ps (all) ====="; dc ps -a || true
              echo "===== docker compose logs (all services, tail 150) ====="; dc logs --tail=150 || true
            }
            trap 'echo "Deploy failed at line ${LINENO}."; dump_diagnostics' ERR

            # 1) Build first: a build failure is reported on its own and leaves the
            #    currently-running stack untouched instead of half-restarting it.
            dc build

            # 2) Recreate the stack. --remove-orphans drops services no longer in compose.
            dc up -d --remove-orphans
            dc ps

            # 3) Wait for the API to report healthy. Homelab cold starts (image pulls,
            #    DB migrations, k3s warmup) can exceed the old 180s window; use 300s.
            for i in $(seq 1 60); do
              if dc exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)" 2>/dev/null; then
                echo "API healthy"
                trap - ERR
                dc ps
                exit 0
              fi
              echo "waiting for API ($i/60)..."
              sleep 5
            done

            echo "API did not become healthy within 300s."
            dump_diagnostics
            exit 1

  # Manual only: full stack on a Mac self-hosted runner (Docker Desktop).
  deploy-local-mac:
    if: ${{ inputs.target == 'local-mac' }}
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Docker Desktop
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "Install Docker Desktop, then re-run."
            exit 1
          fi

          DESKTOP_SOCK="${HOME}/.docker/run/docker.sock"
          if [ ! -S /var/run/docker.sock ] && [ -S "$DESKTOP_SOCK" ]; then
            echo "DOCKER_HOST=unix://${DESKTOP_SOCK}" >> "$GITHUB_ENV"
            export DOCKER_HOST="unix://${DESKTOP_SOCK}"
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "Docker daemon not reachable. Starting Docker Desktop..."
            open -a Docker || true
            for i in $(seq 1 90); do
              if [ -S "$DESKTOP_SOCK" ]; then
                echo "DOCKER_HOST=unix://${DESKTOP_SOCK}" >> "$GITHUB_ENV"
                export DOCKER_HOST="unix://${DESKTOP_SOCK}"
              fi
              if docker info >/dev/null 2>&1; then
                break
              fi
              echo "waiting for Docker Desktop ($i/90)..."
              sleep 2
            done
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "Still cannot reach the Docker daemon on this Mac runner."
            exit 1
          fi

          docker version
          docker compose version

      - name: Write compose env
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          LAUNCHPAD_PUBLIC_ORIGIN: ${{ secrets.LAUNCHPAD_PUBLIC_ORIGIN }}
          AUTH_DEV_LOGIN_ENABLED: ${{ secrets.AUTH_DEV_LOGIN_ENABLED }}
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-launchpad-local-db}"
          JWT_SECRET="${JWT_SECRET:-launchpad-local-jwt-change-me}"
          SECRETS_ENCRYPTION_KEY="${SECRETS_ENCRYPTION_KEY:-launchpad-local-secrets-key-32b}"
          cat > deploy/oci/.env <<EOF
          POSTGRES_USER=launchpad
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=launchpad
          JWT_SECRET=${JWT_SECRET}
          SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY}
          LAUNCHPAD_PUBLIC_ORIGIN=${LAUNCHPAD_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
          LAUNCHPAD_SITE_ADDRESS=:80
          CADDY_HTTP_PORT=8080
          CADDY_HTTPS_PORT=8443
          AUTH_DEV_LOGIN_ENABLED=${AUTH_DEV_LOGIN_ENABLED:-true}
          USE_CLOUDFLARE_TUNNEL=false
          ENVIRONMENT=development
          LOG_LEVEL=INFO
          KUBERNETES_ENABLED=true
          LOCAL_K8S_ENGINE=k3s
          KIND_AUTO_MANAGE=true
          KIND_CLUSTER_NAME=launchpad
          DOCKER_SOCK=/var/run/docker.sock
          K3D_API_HOST=host.docker.internal
          K3D_API_PORT=6445
          K3D_API_BIND_HOST=0.0.0.0
          DEFAULT_WORKLOAD_IMAGE=nginx:1.27-alpine
          TTL_REAPER_INTERVAL_SECONDS=300
          EOF
          sed -i.bak 's/^[[:space:]]*//' deploy/oci/.env && rm -f deploy/oci/.env.bak

      - name: Build and start full stack
        run: |
          docker compose \
            -f deploy/oci/docker-compose.yml \
            --env-file deploy/oci/.env \
            up -d --build

      - name: Show status
        run: |
          docker compose \
            -f deploy/oci/docker-compose.yml \
            --env-file deploy/oci/.env \
            ps
          echo "Open http://127.0.0.1:8080 when healthy (Caddy on host port 8080)."

      - name: Wait for API health
        run: |
          set -e
          for i in $(seq 1 36); do
            if docker compose -f deploy/oci/docker-compose.yml --env-file deploy/oci/.env \
              exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"; then
              echo "API healthy"
              exit 0
            fi
            echo "waiting for API ($i/36)..."
            sleep 5
          done
          docker compose -f deploy/oci/docker-compose.yml --env-file deploy/oci/.env logs --tail=80 api
          exit 1
