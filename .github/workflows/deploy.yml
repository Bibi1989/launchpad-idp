name: Deploy to OCI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd ~/launchpad-idp

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            docker compose -f deploy/oci/docker-compose.yml --env-file deploy/oci/.env build
            docker compose -f deploy/oci/docker-compose.yml --env-file deploy/oci/.env up -d --no-build
            docker image prune -f