name: Deploy full stack

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options:
          - oci
          - local-mac
        default: oci

jobs:
  # Manual only (workflow_dispatch, target=oci): SSH to a remote server and recreate Compose.
  # Push-to-main deploys go to the self-hosted Mac runner (deploy-local-mac) instead.
  deploy-oci:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'oci') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require SSH deploy secrets
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          missing=0
          for v in OCI_HOST OCI_USERNAME OCI_SSH_KEY; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Homelab deploy needs OCI_HOST, OCI_USERNAME, and OCI_SSH_KEY."
            echo "App secrets (POSTGRES_PASSWORD, JWT_SECRET, …) are kept on the server in deploy/oci/.env when GitHub secrets are unset."
            exit 1
          fi

      - name: Deploy over SSH (git pull + compose up)
        uses: appleboy/ssh-action@v1.2.0
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          LAUNCHPAD_PUBLIC_ORIGIN: ${{ secrets.LAUNCHPAD_PUBLIC_ORIGIN }}
          LAUNCHPAD_SITE_ADDRESS: ${{ secrets.LAUNCHPAD_SITE_ADDRESS }}
          AUTH_DEV_LOGIN_ENABLED: ${{ secrets.AUTH_DEV_LOGIN_ENABLED }}
          USE_CLOUDFLARE_TUNNEL: ${{ secrets.USE_CLOUDFLARE_TUNNEL }}
          PREVIEW_BASE_DOMAIN: ${{ secrets.PREVIEW_BASE_DOMAIN }}
          PREVIEW_TUNNEL_MODE: ${{ secrets.PREVIEW_TUNNEL_MODE }}
          CADDY_HTTP_PORT: ${{ secrets.CADDY_HTTP_PORT }}
          CADDY_HTTPS_PORT: ${{ secrets.CADDY_HTTPS_PORT }}
          KUBERNETES_ENABLED: ${{ secrets.KUBERNETES_ENABLED }}
          REPO_URL: ${{ secrets.LAUNCHPAD_REPO_URL }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_APP_SLUG: ${{ secrets.GH_APP_SLUG }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PREVIEW_INGRESS_CLASS: ${{ secrets.PREVIEW_INGRESS_CLASS }}
          PREVIEW_INGRESS_HTTP_PORT: ${{ secrets.PREVIEW_INGRESS_HTTP_PORT }}
          PREVIEW_INGRESS_HTTPS_PORT: ${{ secrets.PREVIEW_INGRESS_HTTPS_PORT }}
          PREVIEW_INGRESS_TCP_PORT: ${{ secrets.PREVIEW_INGRESS_TCP_PORT }}
          PREVIEW_INGRESS_UDP_PORT: ${{ secrets.PREVIEW_INGRESS_UDP_PORT }}
          PREVIEW_INGRESS_TLS_PORT: ${{ secrets.PREVIEW_INGRESS_TLS_PORT }}
          PREVIEW_INGRESS_TLS_PORT: ${{ secrets.PREVIEW_INGRESS_TLS_PORT }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          command_timeout: 45m
          envs: POSTGRES_PASSWORD,JWT_SECRET,SECRETS_ENCRYPTION_KEY,LAUNCHPAD_PUBLIC_ORIGIN,LAUNCHPAD_SITE_ADDRESS,AUTH_DEV_LOGIN_ENABLED,USE_CLOUDFLARE_TUNNEL,PREVIEW_BASE_DOMAIN,PREVIEW_TUNNEL_MODE,CADDY_HTTP_PORT,CADDY_HTTPS_PORT,KUBERNETES_ENABLED,REPO_URL,OCI_HOST,GH_TOKEN,GITHUB_APP_ID,GITHUB_APP_PRIVATE_KEY,GITHUB_APP_SLUG,WEBHOOK_SECRET
          script: |
            set -euo pipefail
            APP_DIR="${HOME}/launchpad-idp"
            REPO="${REPO_URL:-https://github.com/Bibi1989/launchpad-idp.git}"
            ENV_FILE="deploy/oci/.env"

            env_get() {
              # Read KEY from existing on-server .env (survives git reset when gitignored).
              key="$1"
              file="$2"
              if [ -f "$file" ]; then
                grep -E "^${key}=" "$file" | head -1 | cut -d= -f2- || true
              fi
            }

            is_placeholder() {
              val="$1"
              case "$val" in
                ""|change-me*|changeme*|replace-me*|TODO*|todo*) return 0 ;;
                *) return 1 ;;
              esac
            }

            gen_secret() {
              if command -v openssl >/dev/null 2>&1; then
                openssl rand -base64 48 | tr -d '\n'
              else
                head -c 48 /dev/urandom | base64 | tr -d '\n'
              fi
            }

            # Prefer an existing env file (gitignored) before clone/reset.
            EXISTING_ENV=""
            for candidate in \
              "$APP_DIR/$ENV_FILE" \
              "$HOME/launchpad/deploy/oci/.env" \
              "$HOME/launchpad-idp/deploy/oci/.env"
            do
              if [ -f "$candidate" ]; then
                EXISTING_ENV="$candidate"
                break
              fi
            done

            # Prefer GitHub secret when set; otherwise keep the value already on the server.
            POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$(env_get POSTGRES_PASSWORD "${EXISTING_ENV}")}"
            JWT_SECRET="${JWT_SECRET:-$(env_get JWT_SECRET "${EXISTING_ENV}")}"
            SECRETS_ENCRYPTION_KEY="${SECRETS_ENCRYPTION_KEY:-$(env_get SECRETS_ENCRYPTION_KEY "${EXISTING_ENV}")}"

            # Fallback: pull from a running compose stack (same host) before generating new values.
            if [ -d "$APP_DIR" ] && [ -f "$APP_DIR/deploy/oci/docker-compose.yml" ]; then
              cd "$APP_DIR"
              if is_placeholder "$POSTGRES_PASSWORD"; then
                POSTGRES_PASSWORD="$(docker compose -f deploy/oci/docker-compose.yml --env-file deploy/oci/.env exec -T postgres printenv POSTGRES_PASSWORD 2>/dev/null || true)"
              fi
              if is_placeholder "$JWT_SECRET"; then
                JWT_SECRET="$(docker compose -f deploy/oci/docker-compose.yml --env-file deploy/oci/.env exec -T api printenv JWT_SECRET 2>/dev/null || true)"
              fi
              if is_placeholder "$SECRETS_ENCRYPTION_KEY"; then
                SECRETS_ENCRYPTION_KEY="$(docker compose -f deploy/oci/docker-compose.yml --env-file deploy/oci/.env exec -T api printenv SECRETS_ENCRYPTION_KEY 2>/dev/null || true)"
              fi
              cd - >/dev/null
            fi

            if is_placeholder "$POSTGRES_PASSWORD"; then POSTGRES_PASSWORD=""; fi
            if is_placeholder "$JWT_SECRET"; then JWT_SECRET=""; fi
            if is_placeholder "$SECRETS_ENCRYPTION_KEY"; then SECRETS_ENCRYPTION_KEY=""; fi

            GENERATED=0
            if [ -z "${POSTGRES_PASSWORD}" ]; then
              POSTGRES_PASSWORD="$(gen_secret)"
              GENERATED=1
            fi
            if [ -z "${JWT_SECRET}" ]; then
              JWT_SECRET="$(gen_secret)"
              GENERATED=1
            fi
            if [ -z "${SECRETS_ENCRYPTION_KEY}" ]; then
              SECRETS_ENCRYPTION_KEY="$(gen_secret)"
              GENERATED=1
            fi
            if [ "$GENERATED" -eq 1 ]; then
              echo "Generated missing app secrets on the server and will write them to $APP_DIR/$ENV_FILE"
              echo "(Re-used on later deploys. Optionally store the same values as GitHub Actions secrets.)"
            fi

            PUBLIC_ORIGIN="${LAUNCHPAD_PUBLIC_ORIGIN:-$(env_get LAUNCHPAD_PUBLIC_ORIGIN "${EXISTING_ENV}")}"
            PUBLIC_ORIGIN="${PUBLIC_ORIGIN:-https://launchpad-idp.online}"
            SITE_ADDRESS="${LAUNCHPAD_SITE_ADDRESS:-$(env_get LAUNCHPAD_SITE_ADDRESS "${EXISTING_ENV}")}"
            SITE_ADDRESS="${SITE_ADDRESS:-:80}"
            case "$SITE_ADDRESS" in
              http://*|https://*|localhost|localhost:*|"") SITE_ADDRESS=":80" ;;
            esac
            HTTP_PORT="${CADDY_HTTP_PORT:-$(env_get CADDY_HTTP_PORT "${EXISTING_ENV}")}"
            HTTP_PORT="${HTTP_PORT:-8080}"
            HTTPS_PORT="${CADDY_HTTPS_PORT:-$(env_get CADDY_HTTPS_PORT "${EXISTING_ENV}")}"
            HTTPS_PORT="${HTTPS_PORT:-8443}"
            CF_TUNNEL="${USE_CLOUDFLARE_TUNNEL:-$(env_get USE_CLOUDFLARE_TUNNEL "${EXISTING_ENV}")}"
            CF_TUNNEL="${CF_TUNNEL:-true}"
            PREVIEW_DOMAIN="${PREVIEW_BASE_DOMAIN:-$(env_get PREVIEW_BASE_DOMAIN "${EXISTING_ENV}")}"
            PREVIEW_DOMAIN="${PREVIEW_DOMAIN:-launchpad-idp.online}"
            PREVIEW_MODE="${PREVIEW_TUNNEL_MODE:-$(env_get PREVIEW_TUNNEL_MODE "${EXISTING_ENV}")}"
            PREVIEW_MODE="${PREVIEW_MODE:-off}"
            K8S_ENABLED="${KUBERNETES_ENABLED:-$(env_get KUBERNETES_ENABLED "${EXISTING_ENV}")}"
            K8S_ENABLED="${K8S_ENABLED:-true}"
            DEV_LOGIN="${AUTH_DEV_LOGIN_ENABLED:-$(env_get AUTH_DEV_LOGIN_ENABLED "${EXISTING_ENV}")}"
            DEV_LOGIN="${DEV_LOGIN:-false}"

            # GitHub App credentials for "GitHub Connect". Prefer the GitHub Actions
            # secret; otherwise reuse the value already on the server so it survives a
            # redeploy. The private key is stored as single-line base64 (a compose .env
            # cannot hold a multiline value); the API base64-decodes it. A raw PEM
            # (multiline or with \n escapes) or an already-base64 value are both accepted.
            GH_APP_ID_V="${GITHUB_APP_ID:-$(env_get GITHUB_APP_ID "${EXISTING_ENV}")}"
            GH_APP_SLUG_V="${GITHUB_APP_SLUG:-$(env_get GITHUB_APP_SLUG "${EXISTING_ENV}")}"
            WEBHOOK_SECRET_V="${WEBHOOK_SECRET:-$(env_get WEBHOOK_SECRET "${EXISTING_ENV}")}"
            if [ -n "${GITHUB_APP_PRIVATE_KEY:-}" ]; then
              if printf '%s' "$GITHUB_APP_PRIVATE_KEY" | grep -q "BEGIN"; then
                GH_APP_KEY_V="$(printf '%b' "$GITHUB_APP_PRIVATE_KEY" | base64 | tr -d '\n')"
              else
                GH_APP_KEY_V="$GITHUB_APP_PRIVATE_KEY"
              fi
            else
              GH_APP_KEY_V="$(env_get GITHUB_APP_PRIVATE_KEY "${EXISTING_ENV}")"
            fi

            # Preserve .env across reset (file is gitignored; still back it up).
            if [ -n "$EXISTING_ENV" ]; then
              cp -a "$EXISTING_ENV" /tmp/launchpad-oci.env.bak
            fi

            # Private repos need auth for git over HTTPS (otherwise git prompts for a
            # username and dies with "could not read Username ... exit 128"). Use the
            # workflow's short-lived GITHUB_TOKEN via a tokenized URL, then scrub it
            # from .git/config so no credential is persisted on the server. Falls back
            # to the plain URL when no token is present (public repo).
            AUTH_REPO="$REPO"
            case "$REPO" in
              http://*|https://*)
                if [ -n "${GH_TOKEN:-}" ]; then
                  AUTH_REPO="https://x-access-token:${GH_TOKEN}@${REPO#http*://}"
                fi
                ;;
            esac

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$AUTH_REPO" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR" || true
            git remote set-url origin "$AUTH_REPO"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            # Leave the clean (token-free) URL persisted as origin.
            git remote set-url origin "$REPO"

            mkdir -p deploy/oci
            umask 077
            cat > deploy/oci/.env <<EOF
            POSTGRES_USER=launchpad
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=launchpad
            JWT_SECRET=${JWT_SECRET}
            SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY}
            LAUNCHPAD_PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
            LAUNCHPAD_SITE_ADDRESS=${SITE_ADDRESS}
            CADDY_HTTP_PORT=${HTTP_PORT}
            CADDY_HTTPS_PORT=${HTTPS_PORT}
            AUTH_DEV_LOGIN_ENABLED=${DEV_LOGIN}
            USE_CLOUDFLARE_TUNNEL=${CF_TUNNEL}
            ENVIRONMENT=production
            PREVIEW_BASE_DOMAIN=${PREVIEW_DOMAIN}
            PREVIEW_TUNNEL_MODE=${PREVIEW_MODE}
            LOG_LEVEL=INFO
            KUBERNETES_ENABLED=${K8S_ENABLED}
            LOCAL_K8S_ENGINE=k3s
            KIND_AUTO_MANAGE=true
            KIND_CLUSTER_NAME=launchpad
            DOCKER_SOCK=/var/run/docker.sock
            K3D_API_HOST=host.docker.internal
            K3D_API_PORT=6445
            K3D_API_BIND_HOST=0.0.0.0
            DEFAULT_WORKLOAD_IMAGE=
            TTL_REAPER_INTERVAL_SECONDS=300
            GITHUB_APP_ID=${GH_APP_ID_V}
            GITHUB_APP_PRIVATE_KEY=${GH_APP_KEY_V}
            GITHUB_APP_SLUG=${GH_APP_SLUG_V}
            WEBHOOK_SECRET=${WEBHOOK_SECRET_V}
            EOF
            sed -i 's/^[[:space:]]*//' deploy/oci/.env

            chmod +x deploy/oci/caddy-entrypoint.sh || true

            # Single source of truth for the compose invocation.
            dc() { docker compose -f deploy/oci/docker-compose.yml --env-file deploy/oci/.env "$@"; }

            # Dump the full stack state so any failure is diagnosable from the run log.
            dump_diagnostics() {
              echo "===== docker compose ps (all) ====="; dc ps -a || true
              echo "===== migrate service log (alembic upgrade head) ====="; dc logs --no-log-prefix migrate || true
              echo "===== docker compose logs (all services, tail 150) ====="; dc logs --tail=150 || true
            }
            # Use explicit `|| fail`, NOT a `trap ... ERR`: an ERR trap does not fire for a
            # command that fails inside a shell function (dc) unless `set -o errtrace`, so
            # diagnostics would be silently skipped and the real error hidden.
            fail() { echo "DEPLOY FAILED: $1"; dump_diagnostics; exit 1; }

            PGUSER="$(grep -E '^POSTGRES_USER=' deploy/oci/.env | head -1 | cut -d= -f2-)"; PGUSER="${PGUSER:-launchpad}"
            PGDB="$(grep -E '^POSTGRES_DB=' deploy/oci/.env | head -1 | cut -d= -f2-)"; PGDB="${PGDB:-launchpad}"
            PGPW="$(grep -E '^POSTGRES_PASSWORD=' deploy/oci/.env | head -1 | cut -d= -f2-)"
            [ -n "$PGPW" ] || fail "POSTGRES_PASSWORD missing from deploy/oci/.env"

            # 1) Build first: a build failure leaves the running stack untouched.
            dc build || fail "docker compose build failed"

            # 2) Start Postgres alone and reconcile its role password to the env value.
            #    Postgres only honours POSTGRES_PASSWORD on the FIRST init of its data
            #    volume, so a rotated password otherwise fails auth for migrate/api
            #    (asyncpg InvalidPasswordError). The local socket uses trust, so we can
            #    reset it without knowing the old password. Idempotent + safe to repeat.
            dc up -d postgres || fail "postgres failed to start"
            # Retry the reconcile until Postgres genuinely serves (this doubles as the
            # readiness wait and rides out the transient restart during first-init).
            # Pipe via stdin: psql interpolates :'pw' from stdin (NOT from -c) and quotes
            # any password characters safely; ON_ERROR_STOP makes SQL errors non-zero.
            reconciled=0
            for i in $(seq 1 30); do
              if echo "ALTER USER \"$PGUSER\" WITH PASSWORD :'pw';" \
                   | dc exec -T postgres psql -v ON_ERROR_STOP=1 -v pw="$PGPW" -U "$PGUSER" -d "$PGDB" >/dev/null 2>&1; then
                reconciled=1; break
              fi
              echo "waiting for postgres before reconciling password ($i/30)..."
              sleep 2
            done
            [ "$reconciled" = 1 ] || fail "could not reconcile the postgres role password"

            # 3) Recreate the full stack (migrate runs alembic, then api/worker/beat/caddy).
            dc up -d --remove-orphans || fail "docker compose up failed (a service did not start or the migration did not complete)"
            dc ps

            # 4) Wait for the API to report healthy (cold starts: image pulls, migrations, k3s warmup).
            for i in $(seq 1 60); do
              if dc exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)" 2>/dev/null; then
                echo "API healthy"
                dc ps
                exit 0
              fi
              echo "waiting for API ($i/60)..."
              sleep 5
            done

            fail "API did not become healthy within 300s"

  # Push to main (and manual target=local-mac): deploy the PRODUCTION stack directly on the
  # server laptop's self-hosted macOS runner - no SSH. Requires the runner to carry both the
  # "self-hosted" and "macOS" labels (GitHub adds "macOS" automatically on a Mac).
  # TODO: add a step to check if the server is reachable by pinging the IP address of the server.
  deploy-local-mac:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'local-mac') }}
    runs-on: [self-hosted, macOS]
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Docker Desktop
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "Install Docker Desktop, then re-run."
            exit 1
          fi

          DESKTOP_SOCK="${HOME}/.docker/run/docker.sock"
          if [ ! -S /var/run/docker.sock ] && [ -S "$DESKTOP_SOCK" ]; then
            echo "DOCKER_HOST=unix://${DESKTOP_SOCK}" >> "$GITHUB_ENV"
            export DOCKER_HOST="unix://${DESKTOP_SOCK}"
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "Docker daemon not reachable. Starting Docker Desktop..."
            open -a Docker || true
            for i in $(seq 1 90); do
              if [ -S "$DESKTOP_SOCK" ]; then
                echo "DOCKER_HOST=unix://${DESKTOP_SOCK}" >> "$GITHUB_ENV"
                export DOCKER_HOST="unix://${DESKTOP_SOCK}"
              fi
              if docker info >/dev/null 2>&1; then
                break
              fi
              echo "waiting for Docker Desktop ($i/90)..."
              sleep 2
            done
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "Still cannot reach the Docker daemon on this Mac runner."
            exit 1
          fi

          docker version
          docker compose version

      - name: Write production compose env
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_APP_SLUG: ${{ secrets.GH_APP_SLUG }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # actions/checkout wipes the workspace each run, so persist secrets OUTSIDE it.
          # Prefer a GitHub secret; else reuse the value already on this server; else
          # generate once and keep it stable across future deploys.
          STABLE_DIR="${HOME}/.launchpad"
          STABLE_ENV="${STABLE_DIR}/oci.env"
          mkdir -p "$STABLE_DIR" && chmod 700 "$STABLE_DIR"

          env_get() { if [ -f "$2" ]; then grep -E "^$1=" "$2" | head -1 | cut -d= -f2- || true; fi; }
          is_placeholder() { case "$1" in ""|change-me*|changeme*|replace-me*|TODO*|todo*) return 0 ;; *) return 1 ;; esac; }
          gen_secret() { if command -v openssl >/dev/null 2>&1; then openssl rand -base64 48 | tr -d '\n'; else head -c 48 /dev/urandom | base64 | tr -d '\n'; fi; }

          POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$(env_get POSTGRES_PASSWORD "$STABLE_ENV")}"
          JWT_SECRET="${JWT_SECRET:-$(env_get JWT_SECRET "$STABLE_ENV")}"
          SECRETS_ENCRYPTION_KEY="${SECRETS_ENCRYPTION_KEY:-$(env_get SECRETS_ENCRYPTION_KEY "$STABLE_ENV")}"
          if is_placeholder "$POSTGRES_PASSWORD"; then POSTGRES_PASSWORD="$(gen_secret)"; fi
          if is_placeholder "$JWT_SECRET"; then JWT_SECRET="$(gen_secret)"; fi
          if is_placeholder "$SECRETS_ENCRYPTION_KEY"; then SECRETS_ENCRYPTION_KEY="$(gen_secret)"; fi

          # GitHub App credentials for "GitHub Connect". Prefer the GitHub Actions
          # secret; else reuse the persisted value. Private key stored as single-line
          # base64 (a compose .env cannot hold multiline); the API base64-decodes it.
          GH_APP_ID_V="${GITHUB_APP_ID:-$(env_get GITHUB_APP_ID "$STABLE_ENV")}"
          GH_APP_SLUG_V="${GITHUB_APP_SLUG:-$(env_get GITHUB_APP_SLUG "$STABLE_ENV")}"
          WEBHOOK_SECRET_V="${WEBHOOK_SECRET:-$(env_get WEBHOOK_SECRET "$STABLE_ENV")}"
          if [ -n "${GITHUB_APP_PRIVATE_KEY:-}" ]; then
            if printf '%s' "$GITHUB_APP_PRIVATE_KEY" | grep -q "BEGIN"; then
              GH_APP_KEY_V="$(printf '%b' "$GITHUB_APP_PRIVATE_KEY" | base64 | tr -d '\n')"
            else
              GH_APP_KEY_V="$GITHUB_APP_PRIVATE_KEY"
            fi
          else
            GH_APP_KEY_V="$(env_get GITHUB_APP_PRIVATE_KEY "$STABLE_ENV")"
          fi

          umask 077
          cat > "$STABLE_ENV" <<EOF
          POSTGRES_USER=launchpad
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=launchpad
          JWT_SECRET=${JWT_SECRET}
          SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY}
          LAUNCHPAD_PUBLIC_ORIGIN=https://launchpad-idp.online
          LAUNCHPAD_SITE_ADDRESS=:80
          CADDY_HTTP_PORT=8080
          CADDY_HTTPS_PORT=8443
          AUTH_DEV_LOGIN_ENABLED=false
          USE_CLOUDFLARE_TUNNEL=true
          ENVIRONMENT=production
          PREVIEW_BASE_DOMAIN=launchpad-idp.online
          PREVIEW_INGRESS_HTTP_PORT=3080
          PREVIEW_TUNNEL_MODE=cloudflared
          LOG_LEVEL=INFO
          KUBERNETES_ENABLED=true
          LOCAL_K8S_ENGINE=k3s
          KIND_AUTO_MANAGE=true
          KIND_CLUSTER_NAME=launchpad
          DOCKER_SOCK=/var/run/docker.sock
          K3D_API_HOST=host.docker.internal
          K3D_API_PORT=6445
          K3D_API_BIND_HOST=0.0.0.0
          DEFAULT_WORKLOAD_IMAGE=
          TTL_REAPER_INTERVAL_SECONDS=300
          GITHUB_APP_ID=${GH_APP_ID_V}
          GITHUB_APP_PRIVATE_KEY=${GH_APP_KEY_V}
          GITHUB_APP_SLUG=${GH_APP_SLUG_V}
          WEBHOOK_SECRET=${WEBHOOK_SECRET_V}
          EOF
          sed -i.bak 's/^[[:space:]]*//' "$STABLE_ENV" && rm -f "$STABLE_ENV.bak"
          # Hand the stable env-file path to later steps.
          echo "COMPOSE_ENV_FILE=$STABLE_ENV" >> "$GITHUB_ENV"

      - name: Build, deploy and health-check
        run: |
          set -euo pipefail
          ENV_FILE="${COMPOSE_ENV_FILE:-$HOME/.launchpad/oci.env}"
          dc() { docker compose -f deploy/oci/docker-compose.yml --env-file "$ENV_FILE" "$@"; }

          dump_diagnostics() {
            echo "===== docker compose ps (all) ====="; dc ps -a || true
            echo "===== migrate service log (alembic upgrade head) ====="; dc logs --no-log-prefix migrate || true
            echo "===== docker compose logs (all services, tail 150) ====="; dc logs --tail=150 || true
          }
          # Explicit `|| fail`, NOT a `trap ... ERR`: an ERR trap does not fire for a
          # command that fails inside a shell function (dc) unless `set -o errtrace`.
          fail() { echo "DEPLOY FAILED: $1"; dump_diagnostics; exit 1; }

          PGUSER="$(grep -E '^POSTGRES_USER=' "$ENV_FILE" | head -1 | cut -d= -f2-)"; PGUSER="${PGUSER:-launchpad}"
          PGDB="$(grep -E '^POSTGRES_DB=' "$ENV_FILE" | head -1 | cut -d= -f2-)"; PGDB="${PGDB:-launchpad}"
          PGPW="$(grep -E '^POSTGRES_PASSWORD=' "$ENV_FILE" | head -1 | cut -d= -f2-)"
          [ -n "$PGPW" ] || fail "POSTGRES_PASSWORD missing from $ENV_FILE"

          chmod +x deploy/oci/caddy-entrypoint.sh || true

          # 1) Build first so a build failure leaves the running stack untouched.
          dc build || fail "docker compose build failed"

          # 2) Start Postgres alone and reconcile its role password to the env value.
          #    Postgres only honours POSTGRES_PASSWORD on the FIRST init of its data
          #    volume, so a rotated password otherwise fails auth for migrate/api
          #    (asyncpg InvalidPasswordError). Local socket uses trust, so we can reset
          #    it without the old password. Idempotent + safe to repeat every deploy.
          dc up -d postgres || fail "postgres failed to start"
          # Retry the reconcile until Postgres genuinely serves (this doubles as the
          # readiness wait and rides out the transient restart during first-init).
          # Pipe via stdin: psql interpolates :'pw' from stdin (NOT from -c) and quotes
          # any password characters safely; ON_ERROR_STOP makes SQL errors non-zero.
          reconciled=0
          for i in $(seq 1 30); do
            if echo "ALTER USER \"$PGUSER\" WITH PASSWORD :'pw';" \
                 | dc exec -T postgres psql -v ON_ERROR_STOP=1 -v pw="$PGPW" -U "$PGUSER" -d "$PGDB" >/dev/null 2>&1; then
              reconciled=1; break
            fi
            echo "waiting for postgres before reconciling password ($i/30)..."
            sleep 2
          done
          [ "$reconciled" = 1 ] || fail "could not reconcile the postgres role password"

          # 3) Recreate the full stack (migrate runs alembic, then api/worker/beat/caddy).
          dc up -d --remove-orphans || fail "docker compose up failed (a service did not start or the migration did not complete)"
          dc ps

          # 4) Wait for the API to report healthy (cold starts: image pulls, migrations, k3d warmup).
          for i in $(seq 1 60); do
            if dc exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)" 2>/dev/null; then
              echo "API healthy - https://launchpad-idp.online (Caddy on host port 8080)"
              dc ps
              exit 0
            fi
            echo "waiting for API ($i/60)..."
            sleep 5
          done

          fail "API did not become healthy within 300s"
