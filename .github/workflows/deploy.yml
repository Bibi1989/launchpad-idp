name: Deploy to OCI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install & Build
        run: |
          npm Install
          npm run build

      - name: Rename Server
        run: |
          pm2 reload my-app || pm2 start npm --name launchpad -- start
