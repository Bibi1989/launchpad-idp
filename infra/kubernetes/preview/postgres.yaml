apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pr-${PR_NUMBER}
  labels:
    app: postgres
    EnvironmentId: pr-${PR_NUMBER}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: launchpad
            - name: POSTGRES_PASSWORD
              value: launchpad
            - name: POSTGRES_DB
              value: launchpad
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "launchpad", "-d", "launchpad"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "launchpad", "-d", "launchpad"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pr-${PR_NUMBER}
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
