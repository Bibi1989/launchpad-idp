apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: pr-${PR_NUMBER}
  labels:
    app: redis
    EnvironmentId: pr-${PR_NUMBER}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: pr-${PR_NUMBER}
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
