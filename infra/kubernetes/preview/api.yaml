apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pr-${PR_NUMBER}
  labels:
    app: api
    EnvironmentId: pr-${PR_NUMBER}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ${API_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://launchpad:launchpad@postgres:5432/launchpad
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
            - name: CORS_ORIGINS
              value: '["https://pr-${PR_NUMBER}.preview.mydomain.com", "http://localhost:3000"]'
            - name: LOG_LEVEL
              value: INFO
            - name: JWT_SECRET
              value: pr-preview-jwt-secret-${PR_NUMBER}
            - name: SECRETS_ENCRYPTION_KEY
              value: pr-preview-encryption-key-${PR_NUMBER}
            - name: KUBERNETES_ENABLED
              value: "false"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pr-${PR_NUMBER}
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: pr-${PR_NUMBER}
  labels:
    app: worker
    EnvironmentId: pr-${PR_NUMBER}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ${API_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO"]
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://launchpad:launchpad@postgres:5432/launchpad
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  namespace: pr-${PR_NUMBER}
  labels:
    app: beat
    EnvironmentId: pr-${PR_NUMBER}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beat
  template:
    metadata:
      labels:
        app: beat
    spec:
      containers:
        - name: beat
          image: ${API_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=INFO"]
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://launchpad:launchpad@postgres:5432/launchpad
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
