apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-namespace
  namespace: lp-example
  labels:
    EnvironmentId: example
    Owner: platform-team
    CreatedBy: launchpad
    TTL_Expiration: "2026-07-30T00:00:00Z"
    launchpad.io/environment-id: example
    launchpad.io/managed-by: launchpad-idp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              launchpad.io/environment-id: example
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
